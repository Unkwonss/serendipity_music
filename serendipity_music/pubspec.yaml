name: serendipity_music
description: "Anti-algorithm music player that breaks the filter bubble"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Audio Engine ---
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  just_audio_background: ^0.0.1-beta.14
  audio_session: ^0.1.25

  # --- Music Source (Jamendo API) ---
  http: ^1.2.2

  # --- State Management ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.0

  # --- Local Database ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # --- UI & UX ---
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  google_fonts: ^6.2.1
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  sliding_up_panel: ^2.0.0+1

  # --- Graph / Chart (Odyssey) ---
  graphview: ^1.2.0
  fl_chart: ^0.69.0

  # --- Utils ---
  uuid: ^4.5.1
  intl: ^0.20.1
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
